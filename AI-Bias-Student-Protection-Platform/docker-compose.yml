version: '3.8'

services:
  equilens:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: equilens-platform
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
    volumes:
      # Persist SQLite audit database across container restarts
      - equilens_data:/app/backend/
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  equilens_data:
    driver: local
